name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RTL simulator
        run: sudo apt-get update && sudo apt-get install --yes iverilog
      - name: Run model and RTL tests
        run: make test
